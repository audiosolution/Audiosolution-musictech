<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#06111f">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ángel Marrufo">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- ICONS -->
  <link rel="apple-touch-icon" href="./angelmarrufoicon.png">
  <link rel="icon" type="image/png" href="./angelmarrufoicon.png">

  <title>Ángel Marrufo | Audio Solutions</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #06111f;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* =========================
       MAIN PAGE
    ========================== */

    .page {
      position: relative;
      width: 100%;
      max-width: 864px;
      overflow: hidden;
      background: #06111f;
    }

    /* =========================
       CARD
    ========================== */

    .card-area {
      position: relative;
      width: 100%;
    }

    .card-area > img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* =========================
       INVISIBLE BUTTONS
    ========================== */

    .hotspot {
      position: absolute;
      left: 5.5%;
      width: 89%;
      z-index: 10;
      border-radius: 36px;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* SAVE MY CONTACT */

    .save {
      top: 40.2%;
      height: 8.4%;
    }

    /* CALL ME */

    .call {
      top: 49.5%;
      height: 8.4%;
    }

    /* EMAIL ME */

    .email {
      top: 58.8%;
      height: 8.4%;
    }

    /* TEXT ME */

    .text {
      top: 68.1%;
      height: 8.4%;
    }

    /* SHARE MY CONTACT */

    .share {
      top: 77.4%;
      height: 8.4%;
    }

    .hotspot:focus-visible {
      outline: 3px solid #36aaff;
      outline-offset: -3px;
      background: rgba(0, 145, 255, 0.10);
    }

    /* =========================
       HOME SCREEN SECTION
    ========================== */

    .home-section {
      padding:
        22px
        5.5%
        calc(38px + env(safe-area-inset-bottom));

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0, 145, 255, 0.16),
          transparent 60%
        ),
        #06111f;
    }

    /* =========================
       ADD TO HOME SCREEN BUTTON
    ========================== */

    .home-button {
      width: 100%;
      min-height: 88px;

      border-radius: 28px;
      border: 3px solid #20c9ff;

      background:
        linear-gradient(
          135deg,
          rgba(0, 38, 76, 0.98),
          rgba(5, 32, 80, 0.98)
        );

      box-shadow:
        0 0 20px rgba(0, 183, 255, 0.30),
        inset 0 0 20px rgba(0, 115, 255, 0.12);

      display: flex;
      align-items: center;

      padding: 10px 26px;

      color: white;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .home-button:hover {
      box-shadow:
        0 0 30px rgba(0, 183, 255, 0.40),
        inset 0 0 20px rgba(0, 115, 255, 0.15);
    }

    .home-button:active {
      transform: scale(0.98);
    }

    /* LOGO */

    .home-logo {
      width: 60px;
      height: 60px;

      object-fit: contain;

      margin-right: 20px;

      border-radius: 14px;
    }

    .home-text {
      flex: 1;

      text-align: left;

      font-size: 26px;
      font-weight: 600;
    }

    .home-arrow {
      margin-left: 15px;

      color: #d9f4ff;

      font-size: 46px;
      font-weight: 300;
    }

    /* =========================
       STAY CONNECTED
    ========================== */

    .stay-connected {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 16px;

      margin-top: 28px;

      color: #9eb7cc;

      font-size: 15px;

      letter-spacing: 6px;
    }

    .stay-connected::before,
    .stay-connected::after {
      content: "";

      width: 75px;
      height: 1px;

      background: #6e879b;
    }

    /* =========================
       POPUP
    ========================== */

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 1000;

      padding: 20px;

      background: rgba(0, 0, 0, 0.84);

      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;

      padding: 32px 26px;

      border: 2px solid #20c9ff;
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          #071a2d,
          #06111f
        );

      box-shadow:
        0 0 40px rgba(0, 183, 255, 0.35);

      color: white;

      text-align: center;
    }

    .popup-logo {
      width: 92px;
      height: 92px;

      object-fit: contain;

      margin-bottom: 12px;

      border-radius: 18px;
    }

    .modal-box h2 {
      margin: 5px 0 20px;

      font-size: 27px;
    }

    .modal-box p {
      margin: 12px 0;

      color: #c8d8e7;

      font-size: 18px;
      line-height: 1.5;
    }

    .modal-box strong {
      color: white;
    }

    .close-button {
      width: 100%;

      margin-top: 24px;

      padding: 16px;

      border: none;
      border-radius: 18px;

      background:
        linear-gradient(
          90deg,
          #009dff,
          #0066ff
        );

      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .home-section {
        padding-top: 18px;
      }

      .home-button {
        min-height: 72px;

        padding: 8px 18px;

        border-width: 2px;
        border-radius: 22px;
      }

      .home-logo {
        width: 48px;
        height: 48px;

        margin-right: 15px;
      }

      .home-text {
        font-size: 19px;
      }

      .home-arrow {
        font-size: 34px;
      }

      .stay-connected {
        gap: 9px;

        font-size: 11px;

        letter-spacing: 4px;
      }

      .stay-connected::before,
      .stay-connected::after {
        width: 40px;
      }

    }

    /* =========================
       DESKTOP
    ========================== */

    @media (min-width: 900px) {

      body {
        padding: 24px 0;
      }

      .page {
        border-radius: 28px;

        box-shadow:
          0 20px 70px
          rgba(0, 0, 0, 0.55);
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =========================
         BUSINESS CARD
    ========================== -->

    <div class="card-area">

      <img
        src="./angel-nfc.png"
        alt="Ángel Marrufo digital NFC business card"
      >


      <!-- SAVE MY CONTACT -->

      <a
        class="hotspot save"
        href="./angel-marrufo.vcf"
        aria-label="Save My Contact"
      ></a>


      <!-- CALL ME -->

      <a
        class="hotspot call"
        href="tel:+14793261678"
        aria-label="Call Me"
      ></a>


      <!-- EMAIL ME -->

      <a
        class="hotspot email"
        href="mailto:ANGELMARRUFO@ICLOUD.COM"
        aria-label="Email Me"
      ></a>


      <!-- TEXT ME -->

      <a
        class="hotspot text"
        href="sms:+14793261678"
        aria-label="Text Me"
      ></a>


      <!-- SHARE MY CONTACT -->

      <a
        class="hotspot share"
        href="#"
        role="button"
        aria-label="Share My Contact"
        onclick="shareBusinessCard(event)"
      ></a>

    </div>


    <!-- =========================
         ADD TO HOME SCREEN
    ========================== -->

    <section class="home-section">

      <button
        class="home-button"
        type="button"
        onclick="addToHomeScreen()"
      >

        <img
          src="./angelmarrufoicon.png"
          class="home-logo"
          alt="Audio Solutions Logo"
        >

        <span class="home-text">
          Add to Home Screen
        </span>

        <span class="home-arrow">
          ›
        </span>

      </button>


      <div class="stay-connected">
        STAY CONNECTED
      </div>

    </section>

  </main>


  <!-- =========================
       INSTALL INSTRUCTIONS
  ========================== -->

  <div
    class="modal"
    id="homeScreenModal"
    onclick="closeModalOutside(event)"
  >

    <div class="modal-box">

      <img
        src="./angelmarrufoicon.png"
        class="popup-logo"
        alt="Audio Solutions"
      >

      <h2>
        Add to Home Screen
      </h2>


      <div id="installInstructions">

        <p>
          Save this business card directly
          to your Home Screen.
        </p>

      </div>


      <button
        class="close-button"
        type="button"
        onclick="closeHomeScreenModal()"
      >
        Got It
      </button>

    </div>

  </div>


  <script>

    /* =========================
       CLEAN URL
    ========================== */

    function getCleanURL() {

      return (
        window.location.origin +
        window.location.pathname
      );

    }


    /* =========================
       SHARE BUSINESS CARD
    ========================== */

    async function shareBusinessCard(event) {

      if (event) {
        event.preventDefault();
      }


      const cleanURL =
        getCleanURL();


      const shareData = {

        title:
          "Ángel Marrufo | Audio Solutions",

        text:
          "Ángel Marrufo — Audio Solutions & Musical Tech",

        url:
          cleanURL

      };


      /* iPhone / Android native share */

      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

          return;

        }

        catch (error) {

          if (
            error.name ===
            "AbortError"
          ) {

            return;

          }

          console.log(
            "Native share error:",
            error
          );

        }

      }


      /* Copy link fallback */

      try {

        await navigator.clipboard.writeText(
          cleanURL
        );

        alert(
          "Business card link copied!"
        );

      }

      catch (error) {

        window.prompt(
          "Copy this business card link:",
          cleanURL
        );

      }

    }


    /* =========================
       PWA INSTALL
    ========================== */

    let deferredPrompt = null;


    window.addEventListener(
      "beforeinstallprompt",
      function(event) {

        event.preventDefault();

        deferredPrompt =
          event;

      }
    );


    window.addEventListener(
      "appinstalled",
      function() {

        deferredPrompt =
          null;

      }
    );


    /* =========================
       ADD TO HOME SCREEN
    ========================== */

    async function addToHomeScreen() {


      /* Already running as installed app */

      if (
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true
      ) {

        alert(
          "Audio Solutions is already on your Home Screen."
        );

        return;

      }


      /* Android install prompt */

      if (deferredPrompt) {

        deferredPrompt.prompt();


        try {

          await deferredPrompt.userChoice;

        }

        catch (error) {

          console.log(
            error
          );

        }


        deferredPrompt =
          null;

        return;

      }


      const userAgent =
        navigator.userAgent.toLowerCase();


      const isIOS =
        /iphone|ipad|ipod/.test(
          userAgent
        );


      const instructions =
        document.getElementById(
          "installInstructions"
        );


      /* iPhone / iPad */

      if (isIOS) {

        instructions.innerHTML = `

          <p>
            Tap the
            <strong>Share</strong>
            button in Safari.
          </p>

          <p>
            Scroll down and tap
            <strong>Add to Home Screen</strong>.
          </p>

          <p>
            Then tap
            <strong>Add</strong>.
          </p>

          <p>
            The Audio Solutions logo will appear
            on your Home Screen.
          </p>

        `;

      }


      /* Other browsers */

      else {

        instructions.innerHTML = `

          <p>
            Open your browser menu.
          </p>

          <p>
            Select
            <strong>Install App</strong>
            or
            <strong>Add to Home Screen</strong>.
          </p>

          <p>
            The Audio Solutions logo will appear
            on your Home Screen.
          </p>

        `;

      }


      document
        .getElementById(
          "homeScreenModal"
        )
        .classList
        .add("show");

    }


    /* =========================
       CLOSE POPUP
    ========================== */

    function closeHomeScreenModal() {

      document
        .getElementById(
          "homeScreenModal"
        )
        .classList
        .remove("show");

    }


    function closeModalOutside(event) {

      if (
        event.target.id ===
        "homeScreenModal"
      ) {

        closeHomeScreenModal();

      }

    }


    /* =========================
       SERVICE WORKER
    ========================== */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register("./service-worker.js")
            .catch(
              function(error) {

                console.log(
                  "Service Worker error:",
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>
</html>
