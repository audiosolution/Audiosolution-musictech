<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#06111f">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Audio Solutions">

  <!-- HOME SCREEN ICON -->
  <link
    rel="apple-touch-icon"
    href="angelmarrufoicon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="angelmarrufoicon.png"
  >

  <title>Ángel Marrufo | Audio Solutions</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;

      background: #06111f;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      display: flex;

      justify-content: center;
      align-items: flex-start;
    }


    /* =========================
       PAGE
    ========================== */

    .page {
      width: 100%;
      max-width: 864px;

      background: #06111f;

      overflow: hidden;
    }


    /* =========================
       BUSINESS CARD IMAGE
    ========================== */

    .card {
      position: relative;

      width: 100%;
    }

    .card-image {
      display: block;

      width: 100%;
      height: auto;

      user-select: none;

      -webkit-user-drag: none;
    }


    /* =========================
       ORIGINAL IMAGE BUTTONS
    ========================== */

    .hotspot {
      position: absolute;

      left: 5.5%;

      width: 89%;

      z-index: 20;

      border-radius: 36px;

      cursor: pointer;

      text-decoration: none;

      -webkit-tap-highlight-color:
        transparent;
    }


    /* SAVE MY CONTACT */

    .save {
      top: 40.2%;
      height: 8.4%;
    }


    /* CALL ME */

    .call {
      top: 49.5%;
      height: 8.4%;
    }


    /* EMAIL ME */

    .email {
      top: 58.8%;
      height: 8.4%;
    }


    /* TEXT ME */

    .text {
      top: 68.1%;
      height: 8.4%;
    }


    /* SHARE MY CONTACT */

    .share {
      top: 77.4%;
      height: 8.4%;
    }


    /* =========================
       NEW BUTTON AREA
    ========================== */

    .actions {

      padding:

        22px
        5.5%
        calc(
          40px +
          env(safe-area-inset-bottom)
        );

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(0, 149, 255, 0.18),
          transparent 55%
        ),

        #06111f;
    }


    /* =========================
       REAL BUTTON
    ========================== */

    .action-button {

      appearance: none;
      -webkit-appearance: none;

      width: 100%;

      min-height: 82px;

      margin: 0 0 18px 0;

      padding: 10px 22px;

      border:

        2px solid
        #22c7ff;

      border-radius: 25px;

      background:

        linear-gradient(
          135deg,
          #06294c,
          #071b3b
        );

      box-shadow:

        0 0 18px
        rgba(0, 180, 255, 0.28),

        inset 0 0 18px
        rgba(0, 130, 255, 0.12);

      display: flex;

      align-items: center;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      cursor: pointer;

      text-align: left;

      -webkit-tap-highlight-color:
        transparent;
    }


    .action-button:active {

      transform:
        scale(0.98);

    }


    /* =========================
       BUTTON ICON AREA
    ========================== */

    .button-icon {

      width: 56px;
      height: 56px;

      min-width: 56px;

      margin-right: 18px;

      display: flex;

      align-items: center;
      justify-content: center;

    }


    /* SHARE ICON */

    .share-icon {

      font-size: 42px;

      color: #d9f5ff;

      line-height: 1;

    }


    /* AUDIO SOLUTIONS LOGO */

    .button-logo {

      width: 56px;
      height: 56px;

      object-fit: contain;

      border-radius: 12px;

    }


    /* =========================
       BUTTON TEXT
    ========================== */

    .button-text {

      flex: 1;

      font-size: 25px;

      font-weight: 600;

      color: white;

    }


    /* ARROW */

    .button-arrow {

      margin-left: 12px;

      color: #d9f5ff;

      font-size: 42px;

      font-weight: 300;

    }


    /* =========================
       STAY CONNECTED
    ========================== */

    .stay-connected {

      margin-top: 26px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 14px;

      color: #8da8bd;

      font-size: 13px;

      letter-spacing: 5px;

    }


    .stay-connected::before,
    .stay-connected::after {

      content: "";

      width: 65px;

      height: 1px;

      background: #60798d;

    }


    /* =========================
       POPUP
    ========================== */

    .modal {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 9999;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.85);

      align-items: center;

      justify-content: center;

    }


    .modal.active {

      display: flex;

    }


    .modal-content {

      width: 100%;

      max-width: 480px;

      padding: 30px 24px;

      border:

        2px solid
        #22c7ff;

      border-radius: 26px;

      background:

        linear-gradient(
          145deg,
          #071c31,
          #06111f
        );

      box-shadow:

        0 0 35px
        rgba(0, 183, 255, 0.35);

      color: white;

      text-align: center;

    }


    .modal-logo {

      width: 90px;

      height: 90px;

      object-fit: contain;

      border-radius: 18px;

      margin-bottom: 12px;

    }


    .modal-content h2 {

      margin:

        5px
        0
        20px;

      font-size: 27px;

    }


    .modal-content p {

      margin:

        12px
        0;

      font-size: 18px;

      line-height: 1.5;

      color: #c8d8e7;

    }


    .modal-content strong {

      color: white;

    }


    .modal-close {

      width: 100%;

      margin-top: 22px;

      padding: 16px;

      border: none;

      border-radius: 17px;

      background:

        linear-gradient(
          90deg,
          #00a6ff,
          #006aff
        );

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .actions {

        padding-top: 18px;

      }


      .action-button {

        min-height: 70px;

        padding:

          8px
          17px;

        border-radius: 21px;

      }


      .button-icon {

        width: 46px;
        height: 46px;

        min-width: 46px;

        margin-right: 14px;

      }


      .button-logo {

        width: 46px;
        height: 46px;

      }


      .share-icon {

        font-size: 34px;

      }


      .button-text {

        font-size: 19px;

      }


      .button-arrow {

        font-size: 34px;

      }


      .stay-connected {

        gap: 8px;

        font-size: 10px;

        letter-spacing: 4px;

      }


      .stay-connected::before,
      .stay-connected::after {

        width: 35px;

      }

    }


    /* =========================
       DESKTOP
    ========================== */

    @media (min-width: 900px) {

      body {

        padding:
          24px 0;

      }


      .page {

        border-radius:
          28px;

        box-shadow:

          0 20px 70px
          rgba(0, 0, 0, 0.55);

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- =========================
         ORIGINAL CARD
    ========================== -->

    <div class="card">


      <img
        class="card-image"
        src="angel-nfc.png"
        alt="Ángel Marrufo Audio Solutions Business Card"
      >


      <!-- SAVE CONTACT -->

      <a
        class="hotspot save"
        href="angel-marrufo.vcf"
        aria-label="Save My Contact"
      ></a>


      <!-- CALL -->

      <a
        class="hotspot call"
        href="tel:+14793261678"
        aria-label="Call Me"
      ></a>


      <!-- EMAIL -->

      <a
        class="hotspot email"
        href="mailto:ANGELMARRUFO@ICLOUD.COM"
        aria-label="Email Me"
      ></a>


      <!-- TEXT -->

      <a
        class="hotspot text"
        href="sms:+14793261678"
        aria-label="Text Me"
      ></a>


      <!-- ORIGINAL SHARE BUTTON -->

      <a
        class="hotspot share"
        href="#"
        aria-label="Share My Contact"
        onclick="shareCard(event)"
      ></a>


    </div>



    <!-- =========================
         NEW REAL BUTTONS
    ========================== -->

    <section class="actions">


      <!-- SHARE BUSINESS CARD -->

      <button
        class="action-button"
        type="button"
        id="shareButton"
      >


        <span class="button-icon">

          <span class="share-icon">
            ↥
          </span>

        </span>


        <span class="button-text">

          Share Business Card

        </span>


        <span class="button-arrow">

          ›

        </span>


      </button>



      <!-- ADD TO HOME SCREEN -->

      <button
        class="action-button"
        type="button"
        id="installButton"
      >


        <span class="button-icon">

          <img
            class="button-logo"
            src="angelmarrufoicon.png"
            alt="Audio Solutions"
          >

        </span>


        <span class="button-text">

          Add to Home Screen

        </span>


        <span class="button-arrow">

          ›

        </span>


      </button>



      <div class="stay-connected">

        STAY CONNECTED

      </div>


    </section>


  </main>



  <!-- =========================
       HOME SCREEN POPUP
  ========================== -->

  <div
    class="modal"
    id="installModal"
  >


    <div class="modal-content">


      <img
        class="modal-logo"
        src="angelmarrufoicon.png"
        alt="Audio Solutions"
      >


      <h2>

        Add to Home Screen

      </h2>


      <div id="instructions">

        <p>
          Save this business card
          to your Home Screen.
        </p>

      </div>


      <button
        class="modal-close"
        type="button"
        id="closeModal"
      >

        Got It

      </button>


    </div>


  </div>



  <script>

    /* =========================
       CLEAN URL
    ========================== */

    function cleanPageURL() {

      return (
        window.location.origin +
        window.location.pathname
      );

    }



    /* =========================
       SHARE FUNCTION
    ========================== */

    async function shareCard(event) {

      if (event) {

        event.preventDefault();

      }


      const pageURL =
        cleanPageURL();


      /*
        NATIVE SHARE
        iPhone / Android
      */

      if (
        typeof navigator.share ===
        "function"
      ) {

        try {

          await navigator.share({

            title:
              "Ángel Marrufo | Audio Solutions",

            text:
              "Ángel Marrufo — Audio Solutions & Musical Tech",

            url:
              pageURL

          });


          return;

        }


        catch (error) {

          /*
            If user simply closes
            the share menu
          */

          if (
            error.name ===
            "AbortError"
          ) {

            return;

          }

        }

      }



      /*
        COPY LINK FALLBACK
      */

      try {

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {

          await navigator.clipboard.writeText(
            pageURL
          );


          alert(
            "Business card link copied!"
          );


          return;

        }

      }

      catch (error) {

        console.log(error);

      }



      /*
        FINAL FALLBACK
      */

      window.prompt(

        "Copy this business card link:",

        pageURL

      );

    }



    /* =========================
       REAL SHARE BUTTON
    ========================== */

    document
      .getElementById(
        "shareButton"
      )
      .addEventListener(
        "click",
        shareCard
      );



    /* =========================
       INSTALL APP
    ========================== */

    let installPrompt = null;


    window.addEventListener(

      "beforeinstallprompt",

      function(event) {

        event.preventDefault();

        installPrompt =
          event;

      }

    );



    /* =========================
       INSTALL BUTTON
    ========================== */

    document
      .getElementById(
        "installButton"
      )
      .addEventListener(

        "click",

        async function() {


          /*
            ALREADY INSTALLED
          */

          if (

            window.matchMedia(
              "(display-mode: standalone)"
            ).matches ||

            window.navigator.standalone ===
            true

          ) {

            alert(
              "Audio Solutions is already on your Home Screen."
            );

            return;

          }



          /*
            ANDROID / CHROME
          */

          if (installPrompt) {

            try {

              installPrompt.prompt();


              await installPrompt.userChoice;


              installPrompt =
                null;


              return;

            }

            catch (error) {

              console.log(
                error
              );

            }

          }



          /*
            DETECT DEVICE
          */

          const ua =
            navigator.userAgent
              .toLowerCase();


          const isIOS =

            /iphone|ipad|ipod/
              .test(ua);


          const isAndroid =

            /android/
              .test(ua);


          const instructions =

            document
              .getElementById(
                "instructions"
              );



          /*
            iPHONE / iPAD
          */

          if (isIOS) {

            instructions.innerHTML = `

              <p>
                Tap the
                <strong>Share</strong>
                button in Safari.
              </p>

              <p>
                Scroll down and select
                <strong>Add to Home Screen</strong>.
              </p>

              <p>
                Tap
                <strong>Add</strong>.
              </p>

              <p>
                The Audio Solutions logo
                will appear on your Home Screen.
              </p>

            `;

          }



          /*
            ANDROID FALLBACK
          */

          else if (isAndroid) {

            instructions.innerHTML = `

              <p>
                Tap your browser menu
                <strong>⋮</strong>.
              </p>

              <p>
                Select
                <strong>Add to Home Screen</strong>
                or
                <strong>Install App</strong>.
              </p>

              <p>
                The Audio Solutions logo
                will appear on your Home Screen.
              </p>

            `;

          }



          /*
            COMPUTER / OTHER
          */

          else {

            instructions.innerHTML = `

              <p>
                Open this page on your phone
                to add the Audio Solutions
                business card to your
                Home Screen.
              </p>

            `;

          }



          document
            .getElementById(
              "installModal"
            )
            .classList
            .add(
              "active"
            );

        }

      );



    /* =========================
       CLOSE POPUP
    ========================== */

    document
      .getElementById(
        "closeModal"
      )
      .addEventListener(

        "click",

        function() {

          document
            .getElementById(
              "installModal"
            )
            .classList
            .remove(
              "active"
            );

        }

      );



    /* CLOSE WHEN TAPPING OUTSIDE */

    document
      .getElementById(
        "installModal"
      )
      .addEventListener(

        "click",

        function(event) {

          if (
            event.target === this
          ) {

            this.classList.remove(
              "active"
            );

          }

        }

      );

  </script>


</body>
</html>
