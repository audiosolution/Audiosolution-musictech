<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06111f">
  <title>Ángel Marrufo | NFC Contact</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #06111f;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      position: relative;
      width: min(100vw, 768px);
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: #06111f;
    }

    .page > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Invisible functional tap zones over the visible buttons */
    .hotspot {
      position: absolute;
      left: 19.8%;
      width: 60.2%;
      z-index: 10;
      border-radius: 36px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .save  { top: 36.0%; height: 7.1%; }
    .call  { top: 44.6%; height: 7.1%; }
    .email { top: 53.2%; height: 7.2%; }
    .text  { top: 62.0%; height: 7.1%; }
    .share { top: 70.5%; height: 7.2%; }

    .hotspot:focus-visible {
      outline: 3px solid #36aaff;
      outline-offset: -3px;
      background: rgba(0,145,255,.10);
    }

    @media (min-width: 769px) {
      body { padding: 24px 0; }
      .page {
        border-radius: 28px;
        box-shadow: 0 20px 70px rgba(0,0,0,.55);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <img src="angel-nfc.png" alt="Ángel Marrufo digital NFC contact card">

    <!-- Saves ALL contact details from angel-marrufo.vcf -->
    <a class="hotspot save"
       href="angel-marrufo.vcf"
       download="Angel-Marrufo.vcf"
       aria-label="Save Ángel Marrufo to contacts"></a>

    <a class="hotspot call"
       href="tel:+14793261678"
       aria-label="Call Ángel Marrufo"></a>

    <a class="hotspot email"
       href="mailto:ANGELMARRUFO@ICLOUD.COM"
       aria-label="Email Ángel Marrufo"></a>

    <a class="hotspot text"
       href="sms:+14793261678"
       aria-label="Text Ángel Marrufo"></a>

    <a class="hotspot share"
       href="#"
       aria-label="Share Ángel Marrufo contact page"
       onclick="
         event.preventDefault();
         if (navigator.share) {
           navigator.share({
             title: 'Ángel Marrufo',
             text: 'Ángel Marrufo — Audio Solutions & Musical Tech',
             url: window.location.href
           });
         } else if (navigator.clipboard) {
           navigator.clipboard.writeText(window.location.href);
           alert('Page link copied.');
         }
       "></a>
  </main>
</body>
</html>
