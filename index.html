<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#06111f">

  <title>Ángel Marrufo | NFC Contact</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #06111f;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* =========================
       MAIN PAGE
    ========================== */

    .page {
      position: relative;

      width: 100%;
      max-width: 864px;

      overflow: hidden;

      background: #06111f;
    }

    /* =========================
       TEMPLATE IMAGE
    ========================== */

    .page > img {
      display: block;

      width: 100%;
      height: auto;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* =========================
       INVISIBLE FUNCTIONAL BUTTONS
    ========================== */

    .hotspot {
      position: absolute;

      left: 5.5%;
      width: 89%;

      z-index: 10;

      border-radius: 36px;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
    }

    /* SAVE MY CONTACT */

    .save {
      top: 40.2%;
      height: 8.4%;
    }

    /* CALL ME */

    .call {
      top: 49.5%;
      height: 8.4%;
    }

    /* EMAIL ME */

    .email {
      top: 58.8%;
      height: 8.4%;
    }

    /* TEXT ME */

    .text {
      top: 68.1%;
      height: 8.4%;
    }

    /* SHARE MY CONTACT */

    .share {
      top: 77.4%;
      height: 8.4%;
    }

    /* Keyboard accessibility */

    .hotspot:focus-visible {
      outline: 3px solid #36aaff;
      outline-offset: -3px;

      background:
        rgba(0, 145, 255, 0.10);
    }

    /* Desktop */

    @media (min-width: 900px) {

      body {
        padding: 24px 0;
      }

      .page {
        border-radius: 28px;

        box-shadow:
          0 20px 70px
          rgba(0, 0, 0, 0.55);
      }

    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         NEW AUDIO SOLUTIONS TEMPLATE
    ========================== -->

    <img
      src="angel-nfc.png"
      alt="Ángel Marrufo digital NFC contact card"
    >


    <!-- =========================
         SAVE MY CONTACT
    ========================== -->

    <a
      class="hotspot save"
      href="angel-marrufo.vcf"
      download="Angel-Marrufo.vcf"
      aria-label="Save Ángel Marrufo to contacts"
    ></a>


    <!-- =========================
         CALL ME
    ========================== -->

    <a
      class="hotspot call"
      href="tel:+14793261678"
      aria-label="Call Ángel Marrufo"
    ></a>


    <!-- =========================
         EMAIL ME
    ========================== -->

    <a
      class="hotspot email"
      href="mailto:ANGELMARRUFO@ICLOUD.COM"
      aria-label="Email Ángel Marrufo"
    ></a>


    <!-- =========================
         TEXT ME
    ========================== -->

    <a
      class="hotspot text"
      href="sms:+14793261678"
      aria-label="Text Ángel Marrufo"
    ></a>


    <!-- =========================
         SHARE MY CONTACT
    ========================== -->

    <a
      class="hotspot share"
      href="#"
      aria-label="Share Ángel Marrufo contact page"
      onclick="shareContact(event)"
    ></a>

  </main>


  <script>

    async function shareContact(event) {

      event.preventDefault();

      const shareData = {

        title:
          "Ángel Marrufo | Audio Solutions",

        text:
          "Ángel Marrufo — Audio Solutions & Musical Tech",

        url:
          window.location.href

      };


      /* Native share menu on iPhone / Android */

      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

        }

        catch (error) {

          console.log(
            "Share cancelled."
          );

        }

      }

      /* Desktop / unsupported browser fallback */

      else if (navigator.clipboard) {

        try {

          await navigator.clipboard.writeText(
            window.location.href
          );

          alert(
            "Page link copied."
          );

        }

        catch (error) {

          window.prompt(
            "Copy this link:",
            window.location.href
          );

        }

      }

      else {

        window.prompt(
          "Copy this link:",
          window.location.href
        );

      }

    }

  </script>

</body>
</html>
